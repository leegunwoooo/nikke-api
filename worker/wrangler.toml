name = "nikke-api-edge"
main = "index.ts"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true


[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "nikke_api_requests"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[kv_namespaces]]
binding = "AREA_KV"
id = "3ed594d98dd248ed97f9f2e9dccb0843"
