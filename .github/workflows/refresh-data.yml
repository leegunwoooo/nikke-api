name: Refresh data (redeploy)

on:
  schedule:
    # 매일 20:00 UTC (05:00 KST) — UTC 자정은 cron 밀집으로 수 시간 지연돼 한산한 시간대로
    # 일요일 슬롯을 따로 두는 이유: date +%u는 실행 지연이 4h 넘으면 요일이
    # 밀려서 강제 배포를 놓친다 — 스케줄 식별자로 판정해야 밀려도 인식됨
    - cron: "0 20 * * 1-6"
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "데이터 변경 여부와 관계없이 강제 재배포"
        type: boolean
        default: false

permissions:
  contents: write # data-latest 릴리즈 artifact 업로드용

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 지난 배포 때의 지문을 캐시에서 복원 (키는 매번 새로 저장하므로 restore-keys로 최신을 찾음)
      - name: Restore stored fingerprint
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .cache-fingerprint
          key: data-fingerprint-${{ github.run_id }}
          restore-keys: |
            data-fingerprint-

      # 대표 목록 파일 + 캐릭터별 ko roledata 해시로 데이터 변경 여부 판정.
      # scene_detail만 바뀌는 경우는 놓칠 수 있어 일요일엔 무조건 배포.
      # 기본 파일을 못 받으면(CDN 장애) 스크립트가 실패해 잘못된 배포/지문 저장을 막음.
      - name: Compute CDN fingerprint
        id: fp
        run: |
          set -o pipefail
          NEW=$(npx tsx scripts/fingerprint.ts | tail -1)
          OLD=$(cat .cache-fingerprint 2>/dev/null || echo "none")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "fingerprint: $NEW (stored: $OLD)"

      - name: Decide whether to redeploy
        id: decide
        run: |
          FORCE="${{ github.event.inputs.force || 'false' }}"
          # github.event.schedule tells us WHICH cron slot fired — a delayed
          # Sunday run still reads as the Sunday schedule, where date-based
          # checks would already see Monday
          if [ "$FORCE" = "true" ]; then
            echo "deploy=yes" >> "$GITHUB_OUTPUT"; echo "reason=forced" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 20 * * 0" ]; then
            echo "deploy=yes" >> "$GITHUB_OUTPUT"; echo "reason=weekly-forced" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.fp.outputs.new }}" != "${{ steps.fp.outputs.old }}" ]; then
            echo "deploy=yes" >> "$GITHUB_OUTPUT"; echo "reason=changed" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=no" >> "$GITHUB_OUTPUT"; echo "reason=unchanged" >> "$GITHUB_OUTPUT"
          fi

      # data/dist를 빌드해 data-latest 릴리즈에 올린다. 로컬 개발과
      # scripts/fetch-dist.mjs 폴백용 백업이고, 실제 서빙은 Pages 배포가 담당한다.
      - name: Build data dist
        if: steps.decide.outputs.deploy == 'yes'
        run: npm run sync && npm run build

      # the API worker reads dist over HTTP from the nikke-api-data Pages
      # project — refreshing data is just a static deploy, no backend rebuild
      - name: Generate file manifest
        if: steps.decide.outputs.deploy == 'yes'
        run: node scripts/manifest.mjs

      # verify before deploying: missing essentials or a shrunken corpus must
      # never reach Pages (also never reach the release backup below)
      - name: Verify dist
        if: steps.decide.outputs.deploy == 'yes'
        run: |
          node -e '
            const fs=require("fs"),path=require("path");
            const root="data/dist";
            const required=["characters.json","events.json","_manifest.json","name_code_map.json","lines/main.json"];
            const missing=required.filter(f=>!fs.existsSync(path.join(root,f)));
            const manifest=JSON.parse(fs.readFileSync(path.join(root,"_manifest.json"),"utf8"));
            if(missing.length){console.error("missing required:",missing);process.exit(1)}
            if(!Array.isArray(manifest)||manifest.length<3000){console.error(`manifest too small: ${manifest.length}`);process.exit(1)}
            console.log(`verified ${manifest.length} dist files`);
          '

      - name: Deploy dist to Cloudflare Pages
        if: steps.decide.outputs.deploy == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy data/dist --project-name=nikke-api-data --branch=main --commit-dirty=true

      - name: Upload dist to data-latest release
        if: steps.decide.outputs.deploy == 'yes'
        run: |
          tar -czf /tmp/dist.tar.gz -C data dist
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title data-latest --notes "Rolling data bundle consumed by Vercel builds"
          gh release upload data-latest /tmp/dist.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save new fingerprint
        if: steps.decide.outputs.deploy == 'yes'
        run: echo "${{ steps.fp.outputs.new }}" > .cache-fingerprint

      - name: Cache fingerprint
        if: steps.decide.outputs.deploy == 'yes'
        uses: actions/cache/save@v4
        with:
          path: .cache-fingerprint
          key: data-fingerprint-${{ github.run_id }}
